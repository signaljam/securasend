name: Sync upstream and open PR

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 6am UTC
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Merge upstream
        id: merge
        run: |
          git remote add upstream https://github.com/timvisee/send.git
          git fetch upstream
          git merge upstream/master --no-edit || true
          if ! git diff-index --quiet HEAD; then
            echo "CHANGES=true" >> $GITHUB_OUTPUT
          fi
      - name: Commit and push if changed
        if: steps.merge.outputs.CHANGES == 'true'
        run: |
          git commit -m "Merge upstream master"
          git push origin master
      - name: Open PR if changes exist
        if: steps.merge.outputs.CHANGES == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Merge upstream master"
          branch: sync-upstream
          title: "Sync upstream master"
          body: "Automated merge of upstream master into fork."
          labels: automation
